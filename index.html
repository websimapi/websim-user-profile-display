<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>User Profile Display</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  {
    "imports": {
      "nipplejs": "https://esm.sh/nipplejs@0.9.0"
    }
  }
  </script>
</head>
<body>
  <main class="container">
    <section class="profile-card" id="profileCard" aria-live="polite">
      <div class="avatar-shell">
        <img id="avatarImg" class="avatar" src="" alt="User avatar" />
      </div>
      <div class="user-info">
        <div id="username" class="username">Loading...</div>
        <div id="status" class="status">Connecting...</div>
      </div>
    </section>

    <div class="controls">
      <button id="refreshBtn" class="btn">Refresh</button>
    </div>
  </main>

  <script type="module" src="app.js"></script>

</html>
